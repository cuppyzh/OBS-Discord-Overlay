<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discord Overlay — StreamKit Stand-in (generated)</title>
<!--
  GENERATED FILE — generated by generate.ps1 from a preset in ./presets.
  Do not edit by hand; edit the preset / templates and re-run the generator.

  PREVIEW ONLY — not used in OBS.

  Reproduces the DOM that streamkit.discord.com/overlay/voice/... produces
  (ul.voice_states > li.voice_state[data-userid] > img.voice_avatar) and
  loads the real generated overlay.css, so what renders here is what OBS
  renders. preview.html stacks this between bg.html and fg.html.

  State per slot:
    offline  -> the <li> is removed, exactly like StreamKit does
    online   -> <li> present, no state class
    talking  -> class wrapper_speaking
    muted    -> class self_mute

  Driven by preview.html via postMessage, or standalone via the query
  string, e.g.  preview-streamkit.html?online=1,2&talking=2&mute=4
  (slot numbers are 1-based; anything not listed stays offline).
-->
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<ul class="voice_states">
{{#USERS}}
  <li class="voice_state" data-userid="{{USER_ID}}" data-slot="{{SLOT_INDEX}}">
    <img class="voice_avatar" src="{{AVATAR_SRC}}" alt="">
    <div class="voice_username">{{DISPLAY_NAME}}</div>
  </li>
{{/USERS}}
</ul>
<script>
(function () {
  var list = document.querySelector('.voice_states');
  // Slots are detached (offline) / re-attached (online) in place, so the
  // original order survives even though only some of them are in the DOM.
  var all = Array.prototype.slice.call(list.children).map(function (li) {
    return { slot: parseInt(li.getAttribute('data-slot'), 10), el: li };
  });
  var state = {};
  all.forEach(function (s) { state[s.slot] = 'offline'; });

  function render() {
    all.forEach(function (s) {
      var st = state[s.slot];
      if (st === 'offline') {
        if (s.el.parentNode) { list.removeChild(s.el); }
        return;
      }
      s.el.className = 'voice_state' +
        (st === 'talking' ? ' wrapper_speaking' : '') +
        (st === 'muted' ? ' self_mute' : '');
      if (!s.el.parentNode) {
        var next = null;
        for (var i = 0; i < all.length; i++) {
          if (all[i].slot > s.slot && all[i].el.parentNode) { next = all[i].el; break; }
        }
        list.insertBefore(s.el, next);
      }
    });
  }

  function setState(slot, st) {
    if (slot === 'all') {
      all.forEach(function (s) { state[s.slot] = st; });
    } else if (state.hasOwnProperty(slot)) {
      state[slot] = st;
    }
    render();
  }

  // ---- query-string fallback: ?online=1,2&talking=3&mute=4 ----
  var params = new URLSearchParams(location.search);
  [['online', 'online'], ['talking', 'talking'], ['mute', 'muted'], ['muted', 'muted']]
    .forEach(function (pair) {
      var raw = params.get(pair[0]);
      if (!raw) { return; }
      raw.split(',').forEach(function (n) {
        n = n.trim();
        if (n === 'all') { setState('all', pair[1]); return; }
        var slot = parseInt(n, 10);
        if (!isNaN(slot)) { setState(slot, pair[1]); }
      });
    });
  render();

  // ---- preview.html control bar ----
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'slot-state') { return; }
    setState(d.slot, d.state);
  });
  // Tell the parent we are ready to take messages.
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'preview-ready' }, '*');
  }
})();
</script>
</body>
</html>
